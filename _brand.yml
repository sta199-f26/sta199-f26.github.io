# Brand colors from Pantone's Fashion Color Trend Report,
# New York Fashion Week Autumn/Winter 2026
# https://www.pantone.com/articles/fashion-color-trend-report/new-york-fashion-week-autumn-winter-2026

color:
  palette:
    egret: "#F3ECE0"           # PANTONE 11-0103 TCX
    acacia: "#DACD65"          # PANTONE 13-0640 TCX
    neptune-green: "#7FBB9E"   # PANTONE 14-6017 TCX
    candied-ginger: "#BFA387"  # PANTONE 15-1213 TCX
    green-envy: "#A19436"      # PANTONE 16-0541 TCX
    muted-clay: "#D29380"      # PANTONE 16-1330 TCX
    foxglove: "#B98391"        # PANTONE 16-1710 TCX
    underworld: "#83807B"      # PANTONE 17-4005 TCX
    all-aboard: "#5C97CB"      # PANTONE 17-4140 TCX
    burnt-olive: "#646049"     # PANTONE 18-0521 TCX
    toffee: "#755139"          # PANTONE 18-1031 TCX
    arabian-spice: "#884332"   # PANTONE 19-1245 TCX
    red-mahogany: "#60373D"    # PANTONE 19-1521 TCX
    festival-fuchsia: "#9E2C6A" # PANTONE 19-2434 TCX
    poseidon: "#133955"        # PANTONE 19-4033 TCX

  foreground: poseidon
  background: white
  primary: all-aboard
  secondary: underworld
  tertiary: neptune-green
  success: green-envy
  info: neptune-green
  warning: acacia
  danger: arabian-spice
  light: white
  dark: poseidon

typography:
  fonts:
    - family: Atkinson Hyperlegible
      source: google
      weight: [400, 700]
    - family: Gochi Hand
      source: google
  base: Atkinson Hyperlegible
  headings: Atkinson Hyperlegible
