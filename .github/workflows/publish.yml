on:
  push:
    branches: main
  workflow_dispatch:

name: Render website

jobs:
  build-website:
    runs-on: self-hosted
    container:
      image: ghcr.io/dukestatsci/r_gh_actions:latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Ensure compatible xfun version
        run: |
          # The container can include an older xfun that missing-package checks skip.
          # Update before checklist or knitr can load its namespace.
          if (length(find.package("xfun", quiet = TRUE)) == 0L ||
              packageVersion("xfun") < "0.62") {
            install.packages("xfun", repos = "https://cloud.r-project.org")
          }
          stopifnot(packageVersion("xfun") >= "0.62")
        shell: Rscript {0}

      - name: Install missing packages
        run: |
          checklist::install_missing_pkgs()
        shell: Rscript {0}

      - name: Render Quarto project
        run: |
          quarto render && touch docs/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
    permissions:
      contents: write
