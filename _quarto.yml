project:
  type: website

brand: _brand.yml

website:
  draft-mode: unlinked
  page-navigation: true
  title: "STA 199"
  description: "Homepage for STA 199 - Introduction to Data Science at Duke University, Fall 2026."
  site-url: "https://sta199-f26.github.io/"

  repo-url: https://github.com/sta199-f26/sta199-f26.github.io/
  repo-actions: [edit, issue]

  open-graph: true

