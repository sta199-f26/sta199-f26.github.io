          - href: course-links.qmd
            text: Useful links
          - href: course-faq.qmd
            text: FAQ
      - section: "Computing"
        contents:
          - href: computing-access.qmd
            text: Access
          - href: computing-code-alongs.qmd
            text: Code alongs
          - href: computing-cheatsheets.qmd
            text: Cheatsheets
